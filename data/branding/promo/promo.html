<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ChallengeGoal promo</title>
    <style>
      @font-face {
        font-family: "Barlow";
        font-weight: 500;
        src: url("/fonts/Barlow_500Medium.ttf");
      }
      @font-face {
        font-family: "Barlow Condensed";
        font-weight: 600;
        src: url("/fonts/BarlowCondensed_600SemiBold.ttf");
      }
      @font-face {
        font-family: "Barlow Condensed";
        font-weight: 700;
        src: url("/fonts/BarlowCondensed_700Bold.ttf");
      }
      @font-face {
        font-family: "Barlow Condensed";
        font-weight: 800;
        font-style: italic;
        src: url("/fonts/BarlowCondensed_800ExtraBold_Italic.ttf");
      }

      :root {
        --ink: #05070a;
        --background: #0a0d12;
        --panel: #121821;
        --panel-raised: #1b2430;
        --stroke: #2b3644;
        --stroke-bright: #5b6b80;
        --text: #f6f8fb;
        --muted: #9ba8ba;
        --body: #d5dbe5;
        --volt: #c8ff2e;
        --gold: #f3c653;
        --gold-deep: #a8741a;
        --blue: #5b9bff;
        --blue-deep: #1d3faf;
        --positive: #3fe08f;
        --display: "Barlow Condensed", sans-serif;
        --sans: "Barlow", sans-serif;
        --cell: 216px;
        --head: 188px;
        --top: 110px;
        --gap: 16px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ink);
      }

      body.poster {
        height: 1350px;
      }

      .stage {
        position: relative;
        width: 1080px;
        height: 100%;
        overflow: hidden;
        color: var(--text);
        font-family: var(--sans);
        background:
          radial-gradient(90% 46% at 50% 0%, rgba(200, 255, 46, 0.2), transparent 70%),
          radial-gradient(80% 40% at 100% 100%, rgba(91, 155, 255, 0.2), transparent 70%),
          radial-gradient(70% 36% at 0% 78%, rgba(243, 198, 83, 0.13), transparent 70%),
          linear-gradient(180deg, #0f141c, var(--ink));
      }

      .display {
        font-family: var(--display);
        font-weight: 800;
        font-style: italic;
        line-height: 0.94;
        white-space: nowrap;
      }

      .beam {
        position: absolute;
        top: -300px;
        width: 260px;
        height: 2600px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.11), transparent 75%);
        filter: blur(34px);
        transform-origin: top center;
        animation: sway var(--period) ease-in-out 0s infinite alternate both;
      }

      .mote {
        position: absolute;
        bottom: -40px;
        width: var(--size);
        height: var(--size);
        border-radius: 50%;
        background: var(--volt);
        opacity: 0;
        animation: float var(--period) linear var(--offset) infinite both;
      }

      .wipe {
        position: absolute;
        top: -10%;
        left: 0;
        width: 100%;
        height: 120%;
        background: linear-gradient(90deg, transparent, rgba(200, 255, 46, 0.5) 45%, rgba(255, 255, 255, 0.75) 50%, rgba(200, 255, 46, 0.5) 55%, transparent);
        transform: translateX(-130%) skewX(-18deg);
        animation: wipe 0.5s ease-in-out calc(var(--t) * 1s - 0.22s) both;
        z-index: 5;
      }

      .scene {
        position: absolute;
        inset: 0;
        animation:
          scene-in 0.38s cubic-bezier(0.2, 0.8, 0.2, 1) calc(var(--start) * 1s) both,
          scene-out 0.26s ease-in calc(var(--end) * 1s - 0.26s) forwards;
      }

      .state {
        animation:
          state-in 0.3s ease-out calc(var(--start) * 1s) both,
          state-out 0.22s ease-in calc(var(--end) * 1s) forwards;
      }

      .layer {
        position: absolute;
        inset: 0;
      }

      .eyebrow {
        font-family: var(--display);
        font-weight: 700;
        font-size: 40px;
        letter-spacing: 0.16em;
        color: var(--volt);
      }

      .in {
        animation-duration: 0.5s;
        animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
        animation-delay: calc(var(--t) * 1s);
        animation-fill-mode: both;
      }

      .pop {
        animation-name: pop;
      }

      .rise {
        animation-name: rise;
      }

      .slam {
        animation-name: slam;
        animation-duration: 0.42s;
      }

      .from-left {
        animation-name: from-left;
      }

      .from-right {
        animation-name: from-right;
      }

      .centered {
        position: absolute;
        left: 70px;
        width: 940px;
        text-align: center;
      }

      .hook .ball {
        position: absolute;
        top: -310px;
        left: -286px;
        width: 1400px;
        height: 1400px;
        animation: fly-in 0.75s cubic-bezier(0.15, 0.9, 0.25, 1) 0.05s both;
      }

      .hook .copy {
        position: absolute;
        top: 740px;
        left: 70px;
        width: 940px;
      }

      .hook h1 {
        margin-top: 18px;
        font-size: 164px;
      }

      .hook h1 span,
      .hook h1 em {
        display: block;
        transform-origin: left center;
      }

      .hook h1 em,
      .poster h1 em {
        color: var(--volt);
        text-shadow: 0 0 60px rgba(200, 255, 46, 0.55);
      }

      .hook .promise {
        position: absolute;
        top: 1296px;
        left: 70px;
        width: 940px;
      }

      .no-ads {
        display: inline-block;
        padding: 16px 36px 10px;
        border-radius: 18px;
        background: var(--volt);
        color: var(--ink);
        font-size: 100px;
        transform: rotate(-3deg);
        box-shadow: 0 0 80px rgba(200, 255, 46, 0.5);
      }

      .hook .promise p {
        margin-top: 34px;
        font-size: 38px;
        color: var(--text);
      }

      .game-title {
        position: absolute;
        top: 246px;
        left: 70px;
        width: 940px;
        font-size: 120px;
        color: var(--volt);
        text-shadow: 0 0 60px rgba(200, 255, 46, 0.45);
      }

      .game-title.short {
        width: 690px;
      }

      .game-rule {
        position: absolute;
        top: 374px;
        left: 70px;
        width: 940px;
        font-size: 36px;
        line-height: 1.25;
        color: var(--body);
      }

      .chip {
        position: absolute;
        top: 274px;
        right: 70px;
        padding: 8px 22px 6px;
        border-radius: 10px;
        background: var(--volt);
        color: var(--ink);
        font-family: var(--display);
        font-weight: 700;
        font-size: 36px;
        letter-spacing: 0.06em;
      }

      .scoreboard {
        position: absolute;
        top: 484px;
        left: 70px;
        width: 940px;
        height: 150px;
        display: grid;
        grid-template-columns: 1fr 150px 1fr;
        gap: 22px;
        align-items: center;
      }

      .plate {
        height: 112px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
        border: 2px solid var(--stroke);
        border-radius: 16px;
        background: linear-gradient(180deg, #1a212c, #0b0f15);
        color: var(--muted);
        font-family: var(--display);
        font-weight: 700;
        font-size: 36px;
        letter-spacing: 0.06em;
      }

      .plate strong {
        font-weight: 800;
        font-style: italic;
        font-size: 80px;
        letter-spacing: 0;
        line-height: 1;
      }

      .plate.you strong {
        color: var(--gold);
      }

      .plate.rival strong {
        color: var(--blue);
      }

      .plate.you[data-state="active"] {
        border-color: var(--gold);
        background: linear-gradient(150deg, #fff1c2, var(--gold) 45%, var(--gold-deep));
      }

      .plate.rival[data-state="active"] {
        border-color: var(--blue);
        background: linear-gradient(150deg, #e3eeff, var(--blue) 45%, var(--blue-deep));
      }

      .plate[data-state="active"],
      .plate[data-state="active"] strong {
        color: var(--ink);
      }

      .clock {
        width: 150px;
        height: 150px;
        display: grid;
        place-items: center;
        border: 11px solid var(--stroke);
        border-radius: 50%;
        background: var(--ink);
        color: var(--muted);
        font-size: 76px;
      }

      .clock[data-state="you"] {
        border-color: var(--gold);
        color: var(--gold);
      }

      .clock[data-state="rival"] {
        border-color: var(--blue);
        color: var(--blue);
      }

      .panel {
        position: absolute;
        left: 70px;
        width: 940px;
        padding: 22px 30px 24px;
        border: 2px solid var(--stroke);
        border-radius: 22px;
        background: linear-gradient(180deg, var(--panel-raised), #0c1017);
      }

      .panel small {
        display: block;
        margin-bottom: 4px;
        font-family: var(--display);
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0.1em;
        color: var(--volt);
      }

      .panel strong {
        display: block;
        font-family: var(--display);
        font-weight: 800;
        font-style: italic;
        font-size: 58px;
        line-height: 1.02;
        white-space: nowrap;
      }

      .button {
        position: absolute;
        left: 70px;
        width: 940px;
        height: 110px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 44px;
        border-radius: 24px;
        font-family: var(--display);
        font-weight: 800;
        font-style: italic;
        font-size: 54px;
        white-space: nowrap;
      }

      .button::after {
        content: "\203A";
        font-size: 64px;
        line-height: 1;
      }

      .button.primary {
        background: var(--volt);
        color: var(--ink);
        box-shadow: 0 0 44px rgba(200, 255, 46, 0.35);
      }

      .button.secondary {
        border: 2px solid var(--stroke-bright);
        background: var(--panel);
        color: var(--text);
      }

      .button.secondary::after {
        color: var(--volt);
      }

      .press {
        animation: press 0.32s ease-out calc(var(--t) * 1s) both;
      }

      .press-twice {
        animation:
          press 0.32s ease-out calc(var(--t) * 1s) both,
          press 0.32s ease-out calc(var(--again) * 1s) both;
      }

      .card {
        position: relative;
        flex: none;
        width: calc(216px * var(--u, 1));
        height: calc(216px * var(--u, 1));
        overflow: hidden;
        border: 3px solid var(--tone);
        border-radius: calc(22px * var(--u, 1));
        background: var(--face);
        color: var(--ink);
      }

      .card img {
        position: absolute;
        top: 2%;
        right: 1%;
        width: 70%;
      }

      .card b {
        position: absolute;
        top: calc(12px * var(--u, 1));
        left: calc(16px * var(--u, 1));
        font-family: var(--display);
        font-weight: 800;
        font-style: italic;
        font-size: calc(44px * var(--u, 1));
        line-height: 1;
      }

      .card span {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 30%;
        display: grid;
        place-items: center;
        padding: 0 calc(6px * var(--u, 1));
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        font-family: var(--display);
        font-weight: 700;
        font-size: calc(28px * var(--u, 1));
        line-height: 1;
        text-align: center;
        white-space: nowrap;
      }

      .card.shiny::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 45%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
        transform: translateX(-160%) skewX(-20deg);
        animation: shine 0.6s ease-out calc(var(--t) * 1s + 0.28s) both;
      }

      .flip {
        animation: flip 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) calc(var(--t) * 1s) both;
      }

      .back {
        flex: none;
        width: calc(216px * var(--u, 1));
        height: calc(216px * var(--u, 1));
        display: grid;
        place-items: center;
        border: 3px solid var(--blue);
        border-radius: calc(22px * var(--u, 1));
        background: repeating-linear-gradient(135deg, #131c2b 0 30px, #1a2740 30px 60px);
        color: var(--blue);
        font-size: calc(130px * var(--u, 1));
        animation:
          pop 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) calc(var(--t) * 1s) both,
          flip-out 0.22s ease-in calc(var(--turned) * 1s) forwards;
      }

      .x {
        --tone: var(--gold);
        --face: linear-gradient(150deg, #fff1c2, var(--gold) 45%, var(--gold-deep));
      }

      .o {
        --tone: var(--blue);
        --face: linear-gradient(150deg, #e3eeff, var(--blue) 45%, var(--blue-deep));
      }

      .play .title {
        position: absolute;
        top: 262px;
        left: 70px;
        font-size: 168px;
        color: var(--volt);
        text-shadow: 0 0 60px rgba(200, 255, 46, 0.45);
      }

      .play .rule-text {
        position: absolute;
        top: 300px;
        left: 400px;
        width: 610px;
        font-size: 40px;
        line-height: 1.2;
        color: var(--body);
      }

      .board {
        position: absolute;
        top: 470px;
        left: 70px;
        width: 940px;
        padding: 28px;
        border: 2px solid var(--stroke);
        border-radius: 34px;
        background: linear-gradient(160deg, var(--panel-raised), var(--panel) 55%, var(--ink));
        box-shadow: 0 40px 110px rgba(0, 0, 0, 0.6);
      }

      .grid {
        position: relative;
        display: grid;
        grid-template-columns: var(--head) repeat(3, var(--cell));
        grid-template-rows: var(--top) repeat(3, var(--cell));
        gap: var(--gap);
      }

      .header {
        display: grid;
        place-items: center;
        align-content: center;
        gap: 8px;
        border: 1.5px solid var(--stroke);
        border-radius: 22px;
        background: var(--panel-raised);
        font-family: var(--display);
        font-weight: 700;
        font-size: 34px;
        letter-spacing: 0.04em;
        line-height: 1;
        text-align: center;
      }

      .header svg {
        width: 92px;
        height: 103px;
      }

      .header.club {
        font-size: 26px;
        padding: 0 8px;
      }

      .cell {
        position: relative;
        border: 2px solid var(--stroke);
        border-radius: 22px;
        background: var(--ink);
      }

      .cell .card {
        position: absolute;
        inset: -2px;
        width: auto;
        height: auto;
      }

      .cell.win {
        animation: pulse 0.5s ease-in-out calc(var(--won) * 1s + 0.1s) both;
      }

      .cell.rest {
        animation: dim 0.35s ease-out calc(var(--won) * 1s + 0.1s) forwards;
      }

      .target {
        position: absolute;
        inset: -4px;
        border: 5px solid var(--tone);
        border-radius: 24px;
        box-shadow:
          0 0 34px var(--tone),
          inset 0 0 26px color-mix(in srgb, var(--tone) 45%, transparent);
        opacity: 0;
        animation: target calc((var(--t) - var(--from)) * 1s + 0.1s) linear calc(var(--from) * 1s) both;
      }

      .ring {
        position: absolute;
        inset: 0;
        border: 6px solid var(--tone);
        border-radius: 24px;
        opacity: 0;
        animation: ring 0.6s ease-out calc(var(--t) * 1s + 0.12s) both;
      }

      .line {
        position: absolute;
        left: calc(var(--head) + var(--gap) + var(--cell) / 2);
        top: calc(var(--top) + var(--gap) + var(--cell) / 2);
        width: 0;
        height: 0;
        transform: rotate(45deg);
        z-index: 2;
      }

      .line i {
        position: absolute;
        left: -84px;
        top: -10px;
        width: 824px;
        height: 20px;
        border-radius: 10px;
        background: var(--volt);
        box-shadow:
          0 0 26px var(--volt),
          0 0 70px rgba(200, 255, 46, 0.7);
        transform-origin: left center;
        animation: grow 0.38s cubic-bezier(0.3, 0.9, 0.3, 1) calc(var(--won) * 1s) both;
      }

      .search {
        position: absolute;
        top: 1368px;
        left: 70px;
        width: 940px;
        height: 104px;
        display: flex;
        align-items: center;
        padding: 0 40px;
        border: 2px solid var(--stroke-bright);
        border-radius: 26px;
        background: var(--panel);
        font-size: 44px;
        color: var(--text);
      }

      .search.empty {
        color: var(--muted);
      }

      .search.live {
        border-color: var(--volt);
        box-shadow: 0 0 40px rgba(200, 255, 46, 0.25);
      }

      .search.live::after {
        content: "";
        width: 4px;
        height: 52px;
        margin-left: 6px;
        background: var(--volt);
      }

      .result {
        position: absolute;
        inset: 0;
        z-index: 3;
        background: rgba(5, 7, 10, 0.86);
        animation: fade 0.28s ease-out calc(var(--t) * 1s) both;
      }

      .result h2 {
        position: absolute;
        top: 420px;
        left: 70px;
        width: 940px;
        text-align: center;
        font-size: 210px;
        color: var(--volt);
        text-shadow: 0 0 80px rgba(200, 255, 46, 0.6);
        animation-delay: calc(var(--t) * 1s + 0.12s);
      }

      .result p {
        position: absolute;
        top: 1330px;
        left: 70px;
        width: 940px;
        text-align: center;
        font-family: var(--display);
        font-weight: 700;
        font-size: 50px;
        letter-spacing: 0.08em;
        animation-delay: calc(var(--t) * 1s + 0.5s);
      }

      .result canvas {
        position: absolute;
        top: 366px;
        left: -276px;
        width: 1620px;
        height: 1080px;
      }

      .duel .concept {
        top: 484px;
      }

      .duel .hint {
        position: absolute;
        top: 642px;
        left: 70px;
        width: 940px;
        font-size: 31px;
        line-height: 1.3;
        text-align: center;
        color: var(--muted);
      }

      .slots {
        position: absolute;
        top: 756px;
        left: 70px;
        width: 940px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 18px;
        --u: 1.023;
      }

      .slot {
        position: relative;
        width: 221px;
        height: 221px;
        display: grid;
        place-items: center;
        border: 3px dashed var(--gold);
        border-radius: 22px;
        color: var(--gold);
        font-family: var(--display);
        font-weight: 700;
        font-size: 64px;
      }

      .slot .card {
        position: absolute;
        inset: -3px;
        width: auto;
        height: auto;
      }

      .count {
        top: 1246px;
        font-family: var(--display);
        font-weight: 700;
        font-size: 36px;
        letter-spacing: 0.14em;
        color: var(--muted);
      }

      .duel .ready {
        top: 1330px;
      }

      .question {
        top: 664px;
        text-align: center;
      }

      .question strong {
        font-size: 48px;
      }

      .versus {
        position: absolute;
        top: 810px;
        left: 70px;
        width: 940px;
        height: 300px;
        --u: 1.39;
      }

      .versus .mine,
      .versus .theirs {
        position: absolute;
        top: 0;
        width: 300px;
        height: 300px;
      }

      .versus .mine {
        left: 80px;
      }

      .versus .theirs {
        right: 80px;
      }

      .versus .theirs > * {
        position: absolute;
        inset: 0;
      }

      .versus .vs {
        position: absolute;
        top: 112px;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 66px;
        color: var(--muted);
      }

      .lost {
        animation: dim 0.35s ease-out calc(var(--t) * 1s) forwards;
      }

      .value {
        position: absolute;
        top: 1122px;
        width: 300px;
        text-align: center;
        font-size: 82px;
      }

      .value.mine {
        left: 150px;
        color: var(--gold);
      }

      .value.theirs {
        left: 630px;
        color: var(--blue);
      }

      .value em {
        margin-left: 10px;
        font-size: 46px;
        color: var(--positive);
      }

      .value small {
        display: block;
        margin-top: 8px;
        font-family: var(--display);
        font-weight: 700;
        font-style: normal;
        font-size: 26px;
        letter-spacing: 0.14em;
        color: var(--muted);
      }

      .verdict {
        top: 1262px;
        font-size: 80px;
        color: var(--positive);
        text-shadow: 0 0 50px rgba(63, 224, 143, 0.45);
      }

      .hand {
        position: absolute;
        top: 1366px;
        left: 70px;
        width: 940px;
        display: flex;
        gap: 14px;
        --u: 0.565;
      }

      .hand .card span {
        font-size: 15px;
      }

      .spent {
        animation: spend 0.3s ease-out calc(var(--t) * 1s) forwards;
      }

      .criteria {
        top: 664px;
      }

      .bid-label {
        top: 846px;
        font-family: var(--display);
        font-weight: 700;
        font-size: 32px;
        letter-spacing: 0.14em;
        color: var(--muted);
      }

      .bid {
        top: 880px;
        font-size: 224px;
        line-height: 1;
        color: var(--muted);
      }

      .bid[data-state="you"] {
        color: var(--gold);
      }

      .bid[data-state="rival"] {
        color: var(--blue);
      }

      .bid-note {
        top: 1102px;
        font-family: var(--display);
        font-weight: 700;
        font-size: 46px;
        letter-spacing: 0.04em;
        color: var(--muted);
      }

      .bid-note[data-state="prompt"] {
        color: var(--volt);
      }

      .bid-note[data-state="progress"] {
        color: var(--gold);
      }

      .stepper {
        position: absolute;
        top: 1180px;
        left: 70px;
        width: 940px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 70px;
        font-size: 84px;
      }

      .stepper i {
        width: 92px;
        height: 92px;
        display: grid;
        place-items: center;
        border: 3px solid var(--volt);
        border-radius: 50%;
        color: var(--volt);
        font-family: var(--sans);
        font-style: normal;
        font-size: 56px;
        line-height: 1;
      }

      .auction .raise {
        top: 1296px;
      }

      .auction .challenge {
        top: 1424px;
      }

      .shout {
        top: 1196px;
        z-index: 2;
      }

      .shout strong {
        display: inline-block;
        padding: 18px 40px 10px;
        border-radius: 18px;
        background: var(--blue);
        color: var(--ink);
        font-size: 124px;
        transform: rotate(-4deg);
        box-shadow: 0 0 90px rgba(91, 155, 255, 0.6);
      }

      .shout small {
        display: block;
        margin-bottom: 18px;
        font-family: var(--display);
        font-weight: 700;
        font-size: 38px;
        letter-spacing: 0.14em;
        color: var(--blue);
      }

      .names {
        position: absolute;
        top: 1180px;
        left: 70px;
        width: 940px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px;
      }

      .names span {
        padding: 8px 20px 6px;
        border: 3px solid var(--positive);
        border-radius: 12px;
        background: rgba(63, 224, 143, 0.1);
        font-family: var(--display);
        font-weight: 700;
        font-size: 38px;
      }

      .auction .search {
        top: 1296px;
      }

      .auction .verdict {
        top: 1424px;
      }

      .trail {
        position: absolute;
        top: 656px;
        left: 70px;
        width: 940px;
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }

      .node {
        width: 130px;
        text-align: center;
        font-family: var(--display);
        font-weight: 700;
        font-size: 28px;
      }

      .node i {
        display: block;
        width: 106px;
        height: 106px;
        margin: 0 auto 6px;
        overflow: hidden;
        border: 3px solid var(--stroke-bright);
        border-radius: 50%;
        background: var(--panel-raised);
      }

      .node img {
        width: 132%;
        margin: 2% 0 0 -22%;
      }

      .link {
        width: 176px;
        padding-top: 20px;
        text-align: center;
        font-family: var(--display);
        font-weight: 700;
        font-size: 21px;
        letter-spacing: 0.01em;
        color: var(--gold);
        white-space: nowrap;
      }

      .link::after {
        content: "";
        display: block;
        height: 3px;
        margin-top: 8px;
        background: var(--gold);
      }

      .last-label {
        top: 824px;
        font-family: var(--display);
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.14em;
        color: var(--muted);
      }

      .last {
        position: absolute;
        top: 868px;
        left: 380px;
        width: 320px;
        height: 320px;
        --u: 1.4815;
      }

      .via {
        top: 1204px;
        font-family: var(--display);
        font-weight: 700;
        font-size: 38px;
        letter-spacing: 0.02em;
        color: var(--gold);
      }

      .turn {
        top: 1264px;
        font-size: 66px;
        color: var(--muted);
      }

      .turn[data-state="you"],
      .turn[data-state="closing"] {
        color: var(--volt);
      }

      .turn[data-state="closing"] {
        font-size: 56px;
      }

      .heading {
        position: absolute;
        top: 270px;
        left: 70px;
        width: 940px;
      }

      .heading .big {
        font-size: 200px;
        color: var(--volt);
        text-shadow: 0 0 60px rgba(200, 255, 46, 0.45);
      }

      .heading .small {
        font-size: 112px;
      }

      .heading .wide {
        font-size: 150px;
      }

      .tiles {
        position: absolute;
        top: 640px;
        left: 70px;
        width: 940px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
      }

      .tile {
        position: relative;
        height: 188px;
        padding: 22px 26px;
        overflow: hidden;
        border: 2px solid var(--stroke);
        border-radius: 24px;
        background: linear-gradient(160deg, var(--panel-raised), var(--panel));
      }

      .tile small {
        display: block;
        font-family: var(--display);
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0.1em;
        color: var(--volt);
      }

      .tile strong {
        display: block;
        margin-top: 4px;
        font-family: var(--display);
        font-weight: 700;
        font-size: 54px;
        line-height: 1;
        white-space: nowrap;
      }

      .tile p {
        margin-top: 10px;
        font-size: 27px;
        line-height: 1.15;
        color: var(--muted);
      }

      .tile::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(200, 255, 46, 0.22), transparent);
        transform: translateX(-160%) skewX(-20deg);
        animation: shine 0.7s ease-out calc(var(--t) * 1s + 0.3s) both;
      }

      .perks {
        position: absolute;
        top: 500px;
        left: 70px;
        width: 940px;
        display: grid;
        gap: 22px;
      }

      .perk {
        padding: 30px 36px 32px;
        border: 2px solid var(--stroke);
        border-left: 12px solid var(--tone);
        border-radius: 24px;
        background: linear-gradient(120deg, var(--panel-raised), var(--panel));
      }

      .perk strong {
        display: block;
        font-family: var(--display);
        font-weight: 700;
        font-size: 60px;
        line-height: 1;
        white-space: nowrap;
      }

      .perk p {
        margin-top: 10px;
        font-size: 32px;
        color: var(--body);
      }

      .numbers {
        position: absolute;
        top: 1290px;
        left: 70px;
        width: 940px;
        text-align: center;
      }

      .numbers .figure {
        font-size: 150px;
        color: var(--gold);
      }

      .numbers .figure small {
        font-size: 72px;
        color: var(--text);
      }

      .numbers p {
        margin-top: 6px;
        font-family: var(--display);
        font-weight: 700;
        font-size: 36px;
        letter-spacing: 0.06em;
        color: var(--body);
      }

      .finale .ball {
        position: absolute;
        top: -230px;
        left: -316px;
        width: 1400px;
        height: 1400px;
        transform-origin: 63% 54%;
      }

      .finale .wordmark {
        top: 836px;
        font-size: 158px;
      }

      .finale .wordmark span,
      .poster .brand span {
        color: var(--volt);
      }

      .finale .wordmark span {
        text-shadow: 0 0 60px rgba(200, 255, 46, 0.5);
      }

      .finale .underline {
        position: absolute;
        top: 998px;
        left: 250px;
        width: 580px;
        height: 12px;
        border-radius: 6px;
        background: var(--volt);
        box-shadow: 0 0 34px rgba(200, 255, 46, 0.8);
        transform-origin: left center;
        animation: grow 0.5s cubic-bezier(0.3, 0.9, 0.3, 1) calc(var(--t) * 1s) both;
      }

      .finale .promise {
        top: 1052px;
      }

      .finale .promise .no-ads {
        padding: 14px 30px 8px;
        font-size: 76px;
      }

      .finale .call {
        top: 1208px;
      }

      .stores {
        position: absolute;
        top: 1268px;
        left: 70px;
        width: 940px;
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 24px;
      }

      .stores div {
        height: 112px;
        display: grid;
        place-items: center;
        border: 2px solid var(--stroke-bright);
        border-radius: 26px;
        background: var(--panel);
        font-family: var(--display);
        font-weight: 700;
        font-size: 56px;
      }

      .finale .site {
        top: 1404px;
        font-family: var(--display);
        font-weight: 700;
        font-size: 58px;
        letter-spacing: 0.04em;
      }

      .finale .notice {
        position: absolute;
        top: 1488px;
        left: 110px;
        width: 860px;
        text-align: center;
        font-size: 23px;
        line-height: 1.3;
        color: var(--muted);
      }

      .poster .brand {
        position: absolute;
        top: 44px;
        left: 40px;
        display: flex;
        align-items: center;
        font-size: 76px;
      }

      .poster .brand img {
        width: 132px;
        height: 132px;
        margin-right: 22px;
      }

      .poster h1 {
        position: absolute;
        top: 236px;
        left: 70px;
        width: 940px;
        font-size: 124px;
      }

      .poster h1 span,
      .poster h1 em {
        display: block;
      }

      .poster .board {
        top: 610px;
        left: 420px;
        transform: scale(0.66);
        transform-origin: top left;
      }

      .poster .line {
        display: none;
      }

      .poster .win .card {
        box-shadow:
          0 0 0 5px var(--volt),
          0 0 44px rgba(200, 255, 46, 0.75);
      }

      .poster .call {
        position: absolute;
        top: 1210px;
        left: 70px;
        font-size: 40px;
      }

      .poster .site {
        position: absolute;
        top: 1264px;
        left: 70px;
        font-family: var(--display);
        font-weight: 700;
        font-size: 44px;
      }

      .poster .notice {
        position: absolute;
        top: 1262px;
        left: 480px;
        width: 560px;
        text-align: right;
        font-size: 18px;
        line-height: 1.3;
        color: var(--muted);
      }

      .poster .pitch {
        position: absolute;
        top: 636px;
        left: 70px;
        width: 330px;
      }

      .poster .pitch .no-ads {
        padding: 14px 22px 8px;
        font-size: 66px;
        line-height: 0.98;
      }

      .poster .pitch strong {
        display: block;
        margin-top: 34px;
        font-family: var(--display);
        font-weight: 800;
        font-style: italic;
        font-size: 96px;
        line-height: 0.95;
        color: var(--gold);
      }

      .poster .pitch small {
        display: block;
        font-family: var(--display);
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.06em;
        color: var(--body);
      }

      .poster * {
        animation: none !important;
      }

      @keyframes scene-in {
        from {
          opacity: 0;
          transform: translateY(36px);
        }
      }

      @keyframes scene-out {
        to {
          opacity: 0;
          transform: translateY(-60px) scale(0.97);
        }
      }

      @keyframes state-in {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
      }

      @keyframes state-out {
        to {
          opacity: 0;
          transform: translateY(-14px);
        }
      }

      @keyframes pop {
        0% {
          opacity: 0;
          transform: scale(0.55);
        }
        60% {
          opacity: 1;
          transform: scale(1.07);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(46px);
        }
      }

      @keyframes slam {
        0% {
          opacity: 0;
          transform: scale(1.7);
          filter: blur(10px);
        }
        55% {
          opacity: 1;
          transform: scale(0.96);
          filter: blur(0);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes from-left {
        from {
          opacity: 0;
          transform: translateX(-160px);
        }
      }

      @keyframes from-right {
        from {
          opacity: 0;
          transform: translateX(160px);
        }
      }

      @keyframes fly-in {
        from {
          transform: translateX(-1100px) rotate(-8deg);
        }
      }

      @keyframes flip {
        0% {
          opacity: 0;
          transform: perspective(900px) rotateY(-100deg) scale(0.7);
        }
        60% {
          opacity: 1;
          transform: perspective(900px) rotateY(12deg) scale(1.06);
        }
        100% {
          transform: perspective(900px) rotateY(0) scale(1);
        }
      }

      @keyframes flip-out {
        to {
          opacity: 0;
          transform: perspective(900px) rotateY(90deg) scale(0.9);
        }
      }

      @keyframes shine {
        to {
          transform: translateX(320%) skewX(-20deg);
        }
      }

      @keyframes ring {
        0% {
          opacity: 0;
          transform: scale(0.7);
        }
        12% {
          opacity: 0.9;
        }
        100% {
          opacity: 0;
          transform: scale(1.7);
        }
      }

      @keyframes target {
        0% {
          opacity: 0;
        }
        20%,
        85% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      @keyframes grow {
        from {
          transform: scaleX(0);
        }
      }

      @keyframes pulse {
        50% {
          transform: scale(1.08);
        }
      }

      @keyframes press {
        40% {
          transform: scale(0.94);
          filter: brightness(1.35);
        }
      }

      @keyframes dim {
        to {
          opacity: 0.38;
        }
      }

      @keyframes spend {
        to {
          opacity: 0.16;
        }
      }

      @keyframes fade {
        from {
          opacity: 0;
        }
      }

      @keyframes wipe {
        to {
          transform: translateX(130%) skewX(-18deg);
        }
      }

      @keyframes float {
        0% {
          transform: translateY(0);
          opacity: 0;
        }
        12%,
        85% {
          opacity: var(--alpha);
        }
        100% {
          transform: translateY(-2100px);
          opacity: 0;
        }
      }

      @keyframes sway {
        from {
          transform: rotate(var(--from));
        }
        to {
          transform: rotate(var(--to));
        }
      }
    </style>
  </head>
  <body>
    <div class="stage"></div>
    <script type="module" src="/promo/promo.js"></script>
  </body>
</html>
