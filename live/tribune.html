<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080" />
    <title>ChallengeGoal Tribün</title>
    <script type="importmap">
      { "imports": { "three": "/three/three.module.js" } }
    </script>
    <style>
      @font-face {
        font-family: "Barlow Condensed";
        font-weight: 800;
        font-style: italic;
        src: url("/fonts/BarlowCondensed_800ExtraBold_Italic.ttf");
      }
      @font-face {
        font-family: "Barlow Condensed";
        font-weight: 700;
        src: url("/fonts/BarlowCondensed_700Bold.ttf");
      }
      @font-face {
        font-family: "Barlow";
        font-weight: 500;
        src: url("/fonts/Barlow_500Medium.ttf");
      }

      :root {
        --ink: #05070a;
        --background: #0a0d12;
        --panel: #121821;
        --raised: #1b2430;
        --stroke: #2b3644;
        --text: #f6f8fb;
        --body: #d5dce6;
        --muted: #9ba8ba;
        --volt: #c8ff2e;
        --display: "Barlow Condensed", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--background);
        color: var(--text);
        font-family: "Barlow", sans-serif;
      }

      .stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background:
          radial-gradient(ellipse 900px 520px at 50% 0%, rgba(200, 255, 46, 0.1), transparent 70%),
          linear-gradient(180deg, #0a1220, #070b12 45%, #05080c);
      }

      #gl {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }

      .display {
        font-family: var(--display);
        font-weight: 800;
        font-style: italic;
        line-height: 0.94;
      }

      .brand {
        position: absolute;
        top: 150px;
        left: 0;
        width: 1080px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 14px;
        font-size: 44px;
      }

      .brand img {
        width: 64px;
        height: 64px;
      }

      .brand b {
        color: var(--volt);
        font-weight: inherit;
      }

      .title {
        position: absolute;
        top: 216px;
        left: 0;
        width: 1080px;
        text-align: center;
        font-size: 124px;
        color: var(--volt);
        text-shadow: 0 0 60px rgba(200, 255, 46, 0.45);
      }

      .join {
        position: absolute;
        top: 346px;
        left: 0;
        width: 1080px;
        text-align: center;
        font-family: var(--display);
        font-weight: 700;
        font-size: 40px;
        color: var(--body);
        text-shadow: 0 2px 12px #000;
      }

      .chips {
        position: absolute;
        top: 402px;
        left: 0;
        width: 1080px;
        display: flex;
        justify-content: center;
        gap: 14px;
      }

      .chips span {
        min-width: 120px;
        padding: 8px 18px 4px;
        border-radius: 12px;
        text-align: center;
        font-family: var(--display);
        font-weight: 800;
        font-style: italic;
        font-size: 40px;
        color: var(--ink);
      }

      .card {
        position: absolute;
        top: 484px;
        left: 70px;
        width: 940px;
        height: 240px;
        padding: 18px 28px;
        border: 2px solid var(--stroke);
        border-radius: 28px;
        background: linear-gradient(160deg, rgba(27, 36, 48, 0.94), rgba(18, 24, 33, 0.94));
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }

      .card.live {
        border-color: var(--volt);
        box-shadow: 0 0 50px rgba(200, 255, 46, 0.25);
      }

      .card .label {
        font-family: var(--display);
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0.14em;
        color: var(--muted);
      }

      .card .criteria {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-top: 6px;
        font-size: 58px;
      }

      .card .criteria b {
        padding: 6px 20px 2px;
        border: 2px solid var(--stroke);
        border-radius: 14px;
        background: var(--ink);
      }

      .card .criteria i {
        font-style: normal;
        color: var(--volt);
      }

      .card .rule {
        margin-top: 8px;
        font-size: 30px;
        color: var(--body);
      }

      .card .timer {
        position: absolute;
        right: 28px;
        top: 18px;
        font-size: 64px;
        color: var(--volt);
      }

      .card .wait {
        margin-top: 14px;
        font-size: 92px;
        color: var(--text);
      }

      .card .list {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        font-family: var(--display);
        font-weight: 700;
        font-size: 30px;
      }

      .card .list span {
        padding: 4px 12px 0;
        border-radius: 10px;
        background: rgba(200, 255, 46, 0.12);
        color: var(--volt);
      }

      .tag {
        position: absolute;
        width: 196px;
        margin-left: -98px;
        text-align: center;
        pointer-events: none;
      }

      .tag.pulse {
        animation: pulse 0.5s ease-out;
      }

      .tag .crest svg {
        width: 42px;
        height: 47px;
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
      }

      .tag .count {
        font-size: 64px;
        text-shadow: 0 3px 14px rgba(0, 0, 0, 0.8);
      }

      .tag .fans {
        font-family: var(--display);
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 0.12em;
        color: var(--body);
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      }

      .tag .points {
        margin-top: 8px;
        font-family: var(--display);
        font-weight: 800;
        font-style: italic;
        font-size: 36px;
        color: var(--volt);
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      }

      .tag .gift {
        display: inline-block;
        margin-top: 4px;
        padding: 3px 12px 0;
        border-radius: 999px;
        background: rgba(5, 7, 10, 0.72);
        font-family: var(--display);
        font-weight: 700;
        font-size: 24px;
        color: var(--body);
      }

      .crown {
        position: absolute;
        width: 64px;
        margin-left: -32px;
        opacity: 0;
        transition: opacity 0.3s;
        filter: drop-shadow(0 0 14px rgba(200, 255, 46, 0.8));
        pointer-events: none;
      }

      .feed {
        position: absolute;
        top: 1566px;
        left: 70px;
        width: 940px;
        height: 220px;
        pointer-events: none;
      }

      .feed .chip {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: 640px;
        padding: 8px 16px 6px 10px;
        border-radius: 999px;
        background: rgba(5, 7, 10, 0.86);
        font-family: var(--display);
        font-weight: 700;
        font-size: 30px;
        white-space: nowrap;
        animation: rise 3.2s ease-out forwards;
      }

      .feed .chip i {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        flex: none;
      }

      .feed .chip em {
        font-style: normal;
        color: var(--muted);
      }

      .burst {
        position: absolute;
        width: 0;
        height: 0;
        pointer-events: none;
      }

      .burst i {
        position: absolute;
        width: 12px;
        height: 18px;
        border-radius: 3px;
        animation: confetti 1.6s ease-out forwards;
      }

      .footer {
        position: absolute;
        top: 1800px;
        left: 0;
        width: 1080px;
        text-align: center;
        font-family: var(--display);
        font-weight: 700;
        font-size: 34px;
        color: var(--muted);
        text-shadow: 0 2px 10px #000;
      }

      .bubbles {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
      }

      .bubble-wrap {
        position: absolute;
        transform: translate(-50%, -100%);
      }

      .bubble-wrap .pop {
        display: grid;
        justify-items: center;
        gap: 4px;
        animation: bubble 4.2s ease-out forwards;
        transform-origin: 50% 100%;
      }

      .bubble-wrap .who {
        max-width: 200px;
        padding: 3px 12px 0;
        border-radius: 999px;
        background: var(--tone);
        color: var(--fore);
        font-family: var(--display);
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      }

      .bubble-wrap .bubble {
        position: relative;
        max-width: 230px;
        padding: 6px 12px 4px;
        border: 3px solid var(--tone);
        border-radius: 16px;
        background: #ffffff;
        color: #05070a;
        font-family: var(--display);
        font-weight: 700;
        font-size: 26px;
        line-height: 1.05;
        text-align: center;
        overflow-wrap: anywhere;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }

      .bubble-wrap .bubble::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -11px;
        width: 14px;
        height: 14px;
        margin-left: -8px;
        background: #ffffff;
        border-right: 3px solid var(--tone);
        border-bottom: 3px solid var(--tone);
        transform: rotate(45deg);
      }

      @keyframes pulse {
        50% {
          transform: scale(1.06);
        }
      }

      @keyframes rise {
        0% {
          transform: translateY(20px);
          opacity: 0;
        }
        12% {
          transform: none;
          opacity: 1;
        }
        80% {
          opacity: 1;
        }
        100% {
          transform: translateY(-24px);
          opacity: 0;
        }
      }

      @keyframes bubble {
        0% {
          transform: translateY(8px) scale(0.6);
          opacity: 0;
        }
        8% {
          transform: none;
          opacity: 1;
        }
        85% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      @keyframes confetti {
        from {
          transform: translate(0, 0) rotate(0deg);
          opacity: 1;
        }
        to {
          transform: translate(var(--dx), var(--dy)) rotate(var(--turn));
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <canvas id="gl" width="1080" height="1920"></canvas>
      <div class="display brand"><img src="/ball.png" alt="" /><span>CHALLENGE<b>GOAL</b></span></div>
      <div class="display title" id="title"></div>
      <div class="join" id="join"></div>
      <div class="chips" id="chips"></div>
      <div class="card" id="card"></div>
      <div id="tags"></div>
      <svg class="crown" id="crown" viewBox="0 0 34 22"><path d="M2 20 L5 5 L12 12 L17 2 L22 12 L29 5 L32 20 Z" fill="#C8FF2E" /></svg>
      <div class="feed" id="feed"></div>
      <div class="footer" id="footer"></div>
      <div class="bubbles" id="bubbles"></div>
    </div>
    <script type="module">
      import * as THREE from 'three';

      const TEAMS = [
        {
          key: 'gs',
          name: 'GALATASARAY',
          short: 'GS',
          crest: { code: 'GS', pattern: 'halves', colors: ['#FDB912', '#A90432'] },
          jersey: '#FDB912',
          scarves: ['#A90432', '#FDB912'],
          seat: '#8f0e2c',
          banner: { bg: '#FDB912', fg: '#A90432' },
          chip: { bg: '#A90432', fg: '#ffffff' },
          light: '#ffb347',
          aliases: ['gs', 'galatasaray', 'cimbom', 'cimbombom', 'aslan', 'gala'],
        },
        {
          key: 'fb',
          name: 'FENERBAHÇE',
          short: 'FB',
          crest: { code: 'FB', pattern: 'stripes', colors: ['#FFED00', '#163962'] },
          jersey: '#FFED00',
          scarves: ['#FFED00', '#163962'],
          seat: '#163962',
          banner: { bg: '#163962', fg: '#FFED00' },
          chip: { bg: '#163962', fg: '#FFED00' },
          light: '#ffe94a',
          aliases: ['fb', 'fener', 'fenerbahce', 'kanarya'],
        },
        {
          key: 'bjk',
          name: 'BEŞİKTAŞ',
          short: 'BJK',
          crest: { code: 'BJK', pattern: 'stripes', colors: ['#000000', '#FFFFFF'] },
          jersey: '#F6F8FB',
          scarves: ['#FFFFFF', '#161616'],
          seat: '#262626',
          banner: { bg: '#111111', fg: '#FFFFFF' },
          chip: { bg: '#161616', fg: '#ffffff' },
          light: '#e8eefc',
          aliases: ['bjk', 'besiktas', 'kartal', 'carsi', 'kara kartal'],
        },
        {
          key: 'ts',
          name: 'TRABZONSPOR',
          short: 'TS',
          crest: { code: 'TS', pattern: 'stripes', colors: ['#7B1B38', '#6CB4E4'] },
          jersey: '#6CB4E4',
          scarves: ['#7B1B38', '#6CB4E4'],
          seat: '#7B1B38',
          banner: { bg: '#7B1B38', fg: '#6CB4E4' },
          chip: { bg: '#7B1B38', fg: '#ffffff' },
          light: '#8cc8f2',
          aliases: ['ts', 'trabzon', 'trabzonspor', 'firtina', 'bordo mavi', 'karadeniz'],
        },
        {
          key: 'amed',
          name: 'AMEDSPOR',
          short: 'AMED',
          crest: { code: 'AMED', pattern: 'halves', colors: ['#D7141A', '#00843D'] },
          jersey: '#D7141A',
          scarves: ['#D7141A', '#00843D'],
          seat: '#00843D',
          banner: { bg: '#00843D', fg: '#FFFFFF' },
          chip: { bg: '#00843D', fg: '#ffffff' },
          light: '#7dff9a',
          aliases: ['amed', 'amedspor'],
        },
      ];
      const SKINS = ['#f1c9a5', '#e0ac80', '#c68642', '#8d5524', '#f6d7b8'];
      const HAIRS = ['#1b1b1b', '#3b2417', '#6b4423', '#c8a45c', '#a33a1f', '#222831'];
      const SHIELD = 'M8 6 H92 V58 C92 86 72 100 50 108 C28 100 8 86 8 58 Z';
      const CREST_SHAPES = {
        halves: (fill) => `<rect x="50" width="50" height="112" fill="${fill}"/>`,
        stripes: (fill) => [1, 3].map((index) => `<rect x="${8 + index * 16.8}" width="16.8" height="112" fill="${fill}"/>`).join(''),
      };

      const params = new URLSearchParams(location.search);
      const DEMO = params.has('demo');
      const BUBBLES = params.get('bubbles') !== '0';
      const GIFT_LABELS = params.get('giftlabels') !== '0';
      const SOUND = params.get('mute') !== '1';
      const VOLUME = Number(params.get('volume') ?? 0.8);
      const SWAY = Number(params.get('sway') ?? 2.6);
      const QUESTION_EVERY = Number(params.get('every') ?? 75) * 1000;
      const ANSWER_TIME = Number(params.get('answer') ?? 25) * 1000;
      const REVEAL_TIME = 7000;
      const SWITCH_COOLDOWN = 10000;
      const ANSWER_POINTS = 10;
      const BURST_LIMIT = 70;
      const LISTED_ANSWERS = 6;
      const NAME_LENGTH = 14;
      const FEED_SLOTS = 4;
      const FEED_STEP = 52;
      const STORAGE_KEY = 'challengegoal-tribune-v2';
      const BUBBLE_LIMIT = 7;
      const BUBBLE_COOLDOWN = 3000;
      const BUBBLE_LENGTH = 44;
      const BUBBLE_LIFETIME = 4200;
      const PREFIX_MIN = 5;
      const EDGE = 8;
      const BLOCKED_LINK = /(https?:|www\.|@|\.com|\.net|\.org|\.tr\b)/i;

      const WIDTH = 1080;
      const HEIGHT = 1920;
      const COLS = 5;
      const ROWS = 12;
      const SPACING = 1.2;
      const STEP = 0.95;
      const DEPTH = 1.1;
      const SECTION = COLS * SPACING + 0.4;
      const GAP = 0.45;
      const ARC = 34;
      const STAND_Z = -14;
      const TOP = ROWS * STEP;
      const CAPACITY = COLS * ROWS;
      const ROOF_FRONT = -(ROWS - 1) * DEPTH - 0.6;
      const TOUCHLINE = -11.5;
      const CAMERA = { x: 0, y: 10, z: 50 };
      const TARGET = { x: 0, y: 11, z: STAND_Z };
      const FAN = 1.35;
      const HOP_MS = 600;

      const element = (id) => document.getElementById(id);
      const escapeText = (value) => String(value).replace(/[&<>"']/g, (character) => `&#${character.charCodeAt(0)};`);
      const fill = (template, values) => template.replace(/\{\{(\w+)\}\}/g, (_, name) => String(values[name] ?? ''));
      const plain = (text) =>
        String(text)
          .replace(/ı/g, 'i')
          .replace(/İ/g, 'i')
          .toLowerCase()
          .normalize('NFKD')
          .replace(/[̀-ͯ]/g, '')
          .replace(/[^0-9a-z]+/g, ' ')
          .trim();
      const number = (value) => value.toLocaleString('tr-TR');
      const hash = (text) => {
        let value = 2166136261;
        for (let index = 0; index < text.length; index += 1) {
          value ^= text.charCodeAt(index);
          value = Math.imul(value, 16777619);
        }
        return value >>> 0;
      };

      const texts = await (await fetch('/texts.json')).json();
      const bank = (await (await fetch('/questions.json')).json()).questions;
      const BLOCKED = (await (await fetch('/blocked.json')).json()).words;
      const giftConfig = await (await fetch('/gifts.json')).json();
      await Promise.all([
        document.fonts.load('italic 800 120px "Barlow Condensed"'),
        document.fonts.load('700 30px "Barlow Condensed"'),
        document.fonts.load('500 30px "Barlow"'),
      ]);

      const zeros = () => Object.fromEntries(TEAMS.map((team) => [team.key, 0]));
      const state = loadState();
      const spoke = new Map();
      const bubbles = [];
      let feedSlot = 0;
      let question = null;
      let phase = 'wait';
      let phaseEnds = Date.now() + 15000;
      let answered = new Map();
      let unused = [];
      let leader = null;

      function loadState() {
        if (params.has('reset')) localStorage.removeItem(STORAGE_KEY);
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) ?? 'null');
          if (saved?.members) return saved;
        } catch {}
        return { members: {}, correct: zeros(), points: zeros() };
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch {}
      }

      const renderer = new THREE.WebGLRenderer({
        canvas: element('gl'),
        antialias: params.get('lowq') !== '1',
        alpha: true,
        powerPreference: 'high-performance',
      });
      renderer.setPixelRatio(1);
      renderer.setSize(WIDTH, HEIGHT, false);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x070b12, 0.0045);
      const camera = new THREE.PerspectiveCamera(58, WIDTH / HEIGHT, 0.5, 400);

      function canvasTexture(width, height, draw, repeatX = 1) {
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        draw(canvas.getContext('2d'), width, height);
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = 8;
        if (repeatX !== 1) {
          texture.wrapS = THREE.RepeatWrapping;
          texture.repeat.set(repeatX, 1);
        }
        return texture;
      }

      function grain(context, width, height, amount) {
        const image = context.getImageData(0, 0, width, height);
        for (let index = 0; index < image.data.length; index += 4) {
          const noise = (Math.random() - 0.5) * amount;
          image.data[index] += noise;
          image.data[index + 1] += noise;
          image.data[index + 2] += noise;
        }
        context.putImageData(image, 0, 0);
      }

      const grass = canvasTexture(
        512,
        256,
        (context, width, height) => {
          context.fillStyle = '#2d8a46';
          context.fillRect(0, 0, width / 2, height);
          context.fillStyle = '#267a3d';
          context.fillRect(width / 2, 0, width / 2, height);
          grain(context, width, height, 26);
        },
        160 / 12,
      );
      const pitch = new THREE.Mesh(new THREE.PlaneGeometry(160, 80), new THREE.MeshStandardMaterial({ map: grass, roughness: 0.95 }));
      pitch.rotation.x = -Math.PI / 2;
      pitch.position.set(0, 0, TOUCHLINE + 40);
      scene.add(pitch);
      const apron = new THREE.Mesh(new THREE.PlaneGeometry(160, 6), new THREE.MeshStandardMaterial({ color: 0x1b2230, roughness: 1 }));
      apron.rotation.x = -Math.PI / 2;
      apron.position.set(0, -0.02, TOUCHLINE - 3);
      scene.add(apron);
      const line = new THREE.Mesh(new THREE.PlaneGeometry(160, 0.25), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      line.rotation.x = -Math.PI / 2;
      line.position.set(0, 0.03, TOUCHLINE);
      scene.add(line);

      scene.add(new THREE.HemisphereLight(0xbcd2ff, 0x1c2a1c, 1.5));
      const sun = new THREE.DirectionalLight(0xfff1d8, 2.4);
      sun.position.set(10, 34, 36);
      scene.add(sun);

      const glowTexture = canvasTexture(128, 128, (context) => {
        const gradient = context.createRadialGradient(64, 64, 0, 64, 64, 64);
        gradient.addColorStop(0, 'rgba(255,248,225,1)');
        gradient.addColorStop(0.25, 'rgba(255,240,200,0.55)');
        gradient.addColorStop(1, 'rgba(255,240,200,0)');
        context.fillStyle = gradient;
        context.fillRect(0, 0, 128, 128);
      });
      const lampTexture = canvasTexture(256, 160, (context, width, height) => {
        context.fillStyle = '#1a1f27';
        context.fillRect(0, 0, width, height);
        context.fillStyle = '#fff6dc';
        for (let row = 0; row < 4; row += 1) {
          for (let column = 0; column < 6; column += 1) {
            context.beginPath();
            context.arc(24 + column * 42, 24 + row * 38, 14, 0, Math.PI * 2);
            context.fill();
          }
        }
      });
      for (const side of [-1, 1]) {
        const tower = new THREE.Group();
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 26, 8), new THREE.MeshStandardMaterial({ color: 0x2a3140 }));
        pole.position.y = 13;
        const panel = new THREE.Mesh(new THREE.BoxGeometry(7, 4.4, 0.5), new THREE.MeshBasicMaterial({ map: lampTexture }));
        panel.position.set(0, 27.5, 0.4);
        const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, fog: false }));
        glow.scale.set(34, 34, 1);
        glow.position.set(0, 27.5, 1.2);
        tower.add(pole, panel, glow);
        tower.position.set(side * 21, 0, -27);
        tower.rotation.y = -side * 0.35;
        scene.add(tower);
      }

      const box = new THREE.BoxGeometry(1, 1, 1);
      const concrete = new THREE.MeshStandardMaterial({ color: 0x6c7482, roughness: 0.95 });
      const concreteDark = new THREE.MeshStandardMaterial({ color: 0x2c323d, roughness: 1 });
      const metal = new THREE.MeshStandardMaterial({ color: 0x1b2029, roughness: 0.7, metalness: 0.4 });
      const lightBar = new THREE.MeshBasicMaterial({ color: 0xfff3d0 });
      const dummy = new THREE.Object3D();

      const torsoGeometry = new THREE.CapsuleGeometry(0.3, 0.55, 3, 8);
      const headGeometry = new THREE.SphereGeometry(0.27, 12, 10);
      const hairGeometry = new THREE.SphereGeometry(0.29, 12, 8, 0, Math.PI * 2, 0, Math.PI * 0.52);
      const armGeometry = new THREE.CylinderGeometry(0.075, 0.075, 0.9, 6);
      const scarfGeometry = new THREE.BoxGeometry(1.15, 0.2, 0.05);
      const fanMaterial = () => new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.75 });

      const slotPosition = (slot) => {
        const row = Math.floor(slot / COLS);
        const column = slot % COLS;
        return { x: (column - (COLS - 1) / 2) * SPACING, y: (row + 1) * STEP, z: -row * DEPTH };
      };
      const ORDER = Array.from({ length: CAPACITY }, (_, slot) => slot).sort((first, second) => {
        const rows = Math.floor(first / COLS) - Math.floor(second / COLS);
        if (rows !== 0) return rows;
        return Math.abs((first % COLS) - (COLS - 1) / 2) - Math.abs((second % COLS) - (COLS - 1) / 2);
      });

      function bannerTexture(team) {
        return canvasTexture(1024, 250, (context, width, height) => {
          context.fillStyle = team.banner.bg;
          context.fillRect(0, 0, width, height);
          context.fillStyle = team.banner.fg;
          context.globalAlpha = 0.25;
          context.fillRect(0, 0, width, 14);
          context.fillRect(0, height - 14, width, 14);
          context.globalAlpha = 1;
          context.font = 'italic 800 170px "Barlow Condensed"';
          context.textAlign = 'center';
          context.textBaseline = 'middle';
          context.fillText(team.name, width / 2, height / 2 + 8);
        });
      }

      const boardTexture = canvasTexture(1024, 160, (context, width, height) => {
        context.fillStyle = '#05070a';
        context.fillRect(0, 0, width, height);
        context.font = 'italic 800 118px "Barlow Condensed"';
        context.textBaseline = 'middle';
        context.fillStyle = '#f6f8fb';
        context.fillText('CHALLENGE', 70, height / 2 + 6);
        const first = context.measureText('CHALLENGE').width;
        context.fillStyle = '#c8ff2e';
        context.fillText('GOAL', 70 + first, height / 2 + 6);
        context.fillStyle = '#c8ff2e';
        context.fillRect(0, height - 10, width, 10);
      });

      const sections = TEAMS.map((team, index) => {
        const group = new THREE.Group();
        const phi = (index - (TEAMS.length - 1) / 2) * ((SECTION + GAP) / ARC);
        group.position.set(ARC * Math.sin(phi), 0, STAND_Z + ARC * (1 - Math.cos(phi)));
        group.rotation.y = -phi;

        const wide = new THREE.InstancedMesh(box, concreteDark, ROWS);
        const narrow = new THREE.InstancedMesh(box, concrete, ROWS);
        for (let row = 0; row < ROWS; row += 1) {
          const height = (row + 1) * STEP;
          dummy.position.set(0, height / 2, -row * DEPTH);
          dummy.scale.set(SECTION + 0.5, height, DEPTH);
          dummy.updateMatrix();
          wide.setMatrixAt(row, dummy.matrix);
          dummy.position.y = height / 2 + 0.01;
          dummy.scale.set(SECTION - 0.2, height + 0.02, DEPTH);
          dummy.updateMatrix();
          narrow.setMatrixAt(row, dummy.matrix);
        }
        group.add(wide, narrow);

        const seatMaterial = new THREE.MeshStandardMaterial({ color: team.seat, roughness: 0.6 });
        const seats = new THREE.InstancedMesh(box, seatMaterial, CAPACITY);
        for (let slot = 0; slot < CAPACITY; slot += 1) {
          const place = slotPosition(slot);
          dummy.position.set(place.x, place.y + 0.4, place.z - 0.4);
          dummy.scale.set(0.92, 0.8, 0.34);
          dummy.updateMatrix();
          seats.setMatrixAt(slot, dummy.matrix);
        }
        group.add(seats);

        const back = new THREE.Mesh(box, concreteDark);
        back.scale.set(SECTION + 0.5, TOP + 4.6, 0.4);
        back.position.set(0, (TOP + 4.6) / 2, -(ROWS - 0.5) * DEPTH - 0.2);
        group.add(back);

        const roof = new THREE.Mesh(box, metal);
        roof.scale.set(SECTION + 0.5, 0.5, 8);
        roof.position.set(0, TOP + 4.15, ROOF_FRONT - 3.9);
        group.add(roof);
        const bar = new THREE.Mesh(box, lightBar);
        bar.scale.set(SECTION + 0.4, 0.12, 0.3);
        bar.position.set(0, TOP + 3.84, ROOF_FRONT + 0.05);
        group.add(bar);

        const bannerMaterial = new THREE.MeshBasicMaterial({ map: bannerTexture(team) });
        const banner = new THREE.Mesh(new THREE.PlaneGeometry(SECTION, 1.5), bannerMaterial);
        banner.position.set(0, TOP + 3.0, ROOF_FRONT + 0.1);
        group.add(banner);

        const board = new THREE.Mesh(new THREE.BoxGeometry(SECTION + 0.2, 1.05, 0.15), new THREE.MeshBasicMaterial({ map: boardTexture }));
        board.position.set(0, 0.55, 1.6);
        group.add(board);

        const glow = new THREE.PointLight(team.light, 0, 34, 1.6);
        glow.position.set(0, TOP * 0.55, 7);
        group.add(glow);

        const torso = new THREE.InstancedMesh(torsoGeometry, fanMaterial(), CAPACITY);
        const head = new THREE.InstancedMesh(headGeometry, fanMaterial(), CAPACITY);
        const hair = new THREE.InstancedMesh(hairGeometry, fanMaterial(), CAPACITY);
        const armLeft = new THREE.InstancedMesh(armGeometry, fanMaterial(), CAPACITY);
        const armRight = new THREE.InstancedMesh(armGeometry, fanMaterial(), CAPACITY);
        const scarf = new THREE.InstancedMesh(scarfGeometry, fanMaterial(), CAPACITY);
        const parts = [torso, head, hair, armLeft, armRight, scarf];
        for (const part of parts) {
          for (let slot = 0; slot < CAPACITY; slot += 1) part.setColorAt(slot, new THREE.Color('#ffffff'));
          part.frustumCulled = false;
          group.add(part);
        }
        scene.add(group);
        return {
          team,
          group,
          bannerMaterial,
          glow,
          torso,
          head,
          hair,
          armLeft,
          armRight,
          scarf,
          slots: Array(CAPACITY).fill(null),
          byId: new Map(),
          phase: Array.from({ length: CAPACITY }, () => Math.random() * Math.PI * 2),
          hopStart: Array(CAPACITY).fill(-1e9),
          cursor: 0,
          energy: 0,
          flash: 0,
        };
      });
      const sectionOf = Object.fromEntries(sections.map((section) => [section.team.key, section]));

      function crestSvg({ code, pattern, colors }) {
        const outline = colors[1] === '#000000' ? '#C9CED6' : colors[1];
        return `<svg viewBox="0 0 100 112"><defs><clipPath id="shield-${code}"><path d="${SHIELD}"/></clipPath></defs><g clip-path="url(#shield-${code})"><rect width="100" height="112" fill="${colors[0]}"/>${CREST_SHAPES[pattern](colors[1])}</g><path d="${SHIELD}" fill="none" stroke="${outline}" stroke-width="5"/><rect x="2" y="38" width="96" height="24" rx="5" fill="#FFFFFF"/><text x="50" y="55.5" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="${code.length > 3 ? 16 : 18}" fill="#05070A">${code}</text></svg>`;
      }

      function seatFan(section, id) {
        const free = ORDER.find((slot) => section.slots[slot] === null);
        const slot = free ?? ORDER[section.cursor++ % CAPACITY];
        const previous = section.slots[slot];
        if (previous !== null) section.byId.delete(previous);
        section.slots[slot] = id;
        section.byId.set(id, slot);
        const code = hash(id);
        const tone = (code >>> 3) % 7;
        const color = new THREE.Color(section.team.jersey);
        color.offsetHSL(0, 0, ((tone - 3) / 3) * 0.04);
        section.torso.setColorAt(slot, color);
        section.head.setColorAt(slot, new THREE.Color(SKINS[code % SKINS.length]));
        section.armLeft.setColorAt(slot, new THREE.Color(SKINS[code % SKINS.length]));
        section.armRight.setColorAt(slot, new THREE.Color(SKINS[code % SKINS.length]));
        section.hair.setColorAt(slot, new THREE.Color(HAIRS[(code >>> 8) % HAIRS.length]));
        section.scarf.setColorAt(slot, new THREE.Color(section.team.scarves[(code >>> 5) % 2]));
        for (const part of [section.torso, section.head, section.hair, section.armLeft, section.armRight, section.scarf]) {
          part.instanceColor.needsUpdate = true;
        }
        section.hopStart[slot] = performance.now();
      }

      function unseatFan(section, id) {
        const slot = section.byId.get(id);
        if (slot === undefined) return;
        section.slots[slot] = null;
        section.byId.delete(id);
      }

      function animateFans(section, seconds, now) {
        const { torso, head, hair, armLeft, armRight, scarf } = section;
        const energy = section.energy;
        const rate = 3.2 + energy * 3 + (leader === section.team.key ? 1.2 : 0);
        for (let slot = 0; slot < CAPACITY; slot += 1) {
          const occupied = section.slots[slot] !== null;
          const place = slotPosition(slot);
          const phase = section.phase[slot];
          const scale = occupied ? 1 : 0;
          const hopProgress = (now - section.hopStart[slot]) / HOP_MS;
          const hop = hopProgress >= 0 && hopProgress < 1 ? Math.sin(hopProgress * Math.PI) * 0.4 : 0;
          const bounce = Math.abs(Math.sin(seconds * rate + phase)) * (0.05 + 0.09 * energy + (leader === section.team.key ? 0.04 : 0)) + hop;
          const lean = Math.sin(seconds * 2 + phase) * 0.05;
          const wave = Math.sin(seconds * 5 + phase) * (0.1 + 0.22 * energy);

          dummy.rotation.set(0, 0, lean);
          dummy.scale.setScalar(scale * FAN);
          dummy.position.set(place.x, place.y + 0.7 * FAN + bounce, place.z);
          dummy.updateMatrix();
          torso.setMatrixAt(slot, dummy.matrix);

          dummy.rotation.set(0, 0, 0);
          dummy.position.set(place.x + lean * 0.8, place.y + 1.52 * FAN + bounce, place.z);
          dummy.updateMatrix();
          head.setMatrixAt(slot, dummy.matrix);
          dummy.position.y += 0.03;
          dummy.position.z -= 0.01;
          dummy.updateMatrix();
          hair.setMatrixAt(slot, dummy.matrix);

          for (const [mesh, side] of [
            [armLeft, -1],
            [armRight, 1],
          ]) {
            const angle = -side * (0.2 + wave * side * side);
            dummy.rotation.set(0, 0, angle);
            dummy.position.set(
              place.x + side * 0.34 * FAN - Math.sin(angle) * 0.45 * FAN,
              place.y + 1.12 * FAN + bounce + Math.cos(angle) * 0.45 * FAN,
              place.z,
            );
            dummy.updateMatrix();
            mesh.setMatrixAt(slot, dummy.matrix);
          }

          dummy.rotation.set(Math.sin(seconds * 3 + phase) * 0.15, 0, Math.sin(seconds * 4 + phase) * (0.08 + 0.16 * energy));
          dummy.position.set(place.x, place.y + 2.16 * FAN + bounce, place.z);
          dummy.updateMatrix();
          scarf.setMatrixAt(slot, dummy.matrix);
        }
        for (const part of [torso, head, hair, armLeft, armRight, scarf]) part.instanceMatrix.needsUpdate = true;
        section.energy = Math.max(0, energy - 0.004);
        section.flash = Math.max(0, section.flash - 0.03);
        section.glow.intensity = section.flash * 380 + (leader === section.team.key ? 70 : 0);
        const shine = 1 + section.flash * 0.9 + (leader === section.team.key ? 0.25 : 0);
        section.bannerMaterial.color.setScalar(shine);
      }

      const projector = new THREE.Vector3();
      function toScreen(section, local) {
        projector.set(local.x, local.y, local.z);
        section.group.localToWorld(projector);
        projector.project(camera);
        return { x: (projector.x * 0.5 + 0.5) * WIDTH, y: (-projector.y * 0.5 + 0.5) * HEIGHT };
      }

      const tags = {};
      function buildTags() {
        element('title').textContent = texts.title;
        element('join').textContent = texts.join;
        element('footer').textContent = texts.footer;
        element('chips').innerHTML = TEAMS.map(
          (team) => `<span style="background:${team.jersey};color:${team.key === 'gs' ? '#A90432' : team.key === 'fb' ? '#163962' : '#05070A'}">${team.short}</span>`,
        ).join('');
        element('tags').innerHTML = TEAMS.map((team) => {
          const label = giftConfig[team.key]?.label;
          const gift = GIFT_LABELS && label ? `<div class="gift">🎁 ${escapeText(label)}</div>` : '';
          return `<div class="tag" id="tag-${team.key}"><div class="crest">${crestSvg(team.crest)}</div><div class="display count">0</div><div class="fans">${escapeText(texts.fans)}</div><div class="points">0 ${escapeText(texts.points)}</div>${gift}</div>`;
        }).join('');
        for (const team of TEAMS) {
          const root = element(`tag-${team.key}`);
          tags[team.key] = { root, count: root.querySelector('.count'), points: root.querySelector('.points') };
        }
      }

      function placeTags() {
        for (const section of sections) {
          const tag = tags[section.team.key];
          const spot = toScreen(section, { x: 0, y: 0, z: 2.7 });
          tag.root.style.left = `${spot.x}px`;
          tag.root.style.top = `${spot.y}px`;
        }
        const top = sections.find((section) => section.team.key === leader);
        const crown = element('crown');
        if (top) {
          const spot = toScreen(top, { x: 0, y: TOP + 4.7, z: ROOF_FRONT });
          crown.style.left = `${spot.x}px`;
          crown.style.top = `${spot.y - 36}px`;
          crown.style.opacity = '1';
        } else {
          crown.style.opacity = '0';
        }
      }

      function counts() {
        const result = zeros();
        for (const member of Object.values(state.members)) result[member.team] += 1;
        return result;
      }

      const sound = { context: null, gains: {} };
      async function setupSound() {
        const Context = window.AudioContext || window.webkitAudioContext;
        if (!SOUND || !Context) return;
        const context = new Context();
        sound.context = context;
        const master = context.createGain();
        master.gain.value = VOLUME;
        master.connect(context.destination);
        for (const team of TEAMS) {
          try {
            const response = await fetch(`/audio/${team.key}`);
            if (!response.ok) continue;
            const buffer = await context.decodeAudioData(await response.arrayBuffer());
            const gain = context.createGain();
            gain.gain.value = 0;
            gain.connect(master);
            const source = context.createBufferSource();
            source.buffer = buffer;
            source.loop = true;
            source.connect(gain);
            source.start();
            sound.gains[team.key] = gain;
          } catch {}
        }
        const resume = () => context.state === 'suspended' && context.resume();
        resume();
        addEventListener('pointerdown', resume);
        addEventListener('keydown', resume);
        document.documentElement.dataset.audio = Object.keys(sound.gains).join(',');
        updateSound();
      }

      function updateSound() {
        document.documentElement.dataset.leader = leader ?? '';
        if (!sound.context) return;
        for (const [key, gain] of Object.entries(sound.gains)) {
          gain.gain.setTargetAtTime(key === leader ? 1 : 0, sound.context.currentTime, 0.7);
        }
      }

      function refresh() {
        const totals = counts();
        const best = Math.max(...Object.values(state.points));
        const tied = state.points[leader] === best;
        if (best <= 0) {
          leader = null;
        } else if (!tied) {
          leader = TEAMS.find((team) => state.points[team.key] === best).key;
        }
        for (const team of TEAMS) {
          tags[team.key].count.textContent = number(totals[team.key]);
          tags[team.key].points.textContent = `${number(state.points[team.key])} ${texts.points}`;
        }
        updateSound();
      }

      function pulse(key, power = 1) {
        const section = sectionOf[key];
        section.flash = Math.max(section.flash, power);
        section.energy = Math.min(1, section.energy + 0.5 * power);
        const root = tags[key].root;
        root.classList.remove('pulse');
        void root.offsetWidth;
        root.classList.add('pulse');
      }

      function aliasPosition(padded, alias) {
        const exact = padded.indexOf(` ${alias} `);
        if (exact >= 0 || alias.includes(' ') || alias.length < PREFIX_MIN) return exact;
        return padded.indexOf(` ${alias}`);
      }

      function teamOf(text) {
        const padded = ` ${plain(text)} `;
        let found = null;
        for (const team of TEAMS) {
          for (const alias of team.aliases) {
            const position = aliasPosition(padded, alias);
            if (position >= 0 && (found === null || position < found.position)) found = { team, position };
          }
        }
        return found?.team ?? null;
      }

      function isBlocked(text) {
        const words = plain(text)
          .replace(/(.)\1+/g, '$1')
          .split(' ');
        return BLOCKED.some((stem) => {
          const squeezed = plain(stem).replace(/(.)\1+/g, '$1');
          return words.some((word) => word.startsWith(squeezed) && (squeezed.length > 3 || word === squeezed));
        });
      }

      function shownName(name) {
        const clean = String(name ?? '').trim();
        if (!clean || isBlocked(clean)) return texts.guest;
        return clean.length > NAME_LENGTH ? `${clean.slice(0, NAME_LENGTH - 1)}…` : clean;
      }

      function cleanMessage(text) {
        const clean = String(text ?? '').replace(/\s+/g, ' ').trim();
        if (!clean || BLOCKED_LINK.test(clean) || isBlocked(clean)) return '';
        return clean.length > BUBBLE_LENGTH ? `${clean.slice(0, BUBBLE_LENGTH - 1)}…` : clean;
      }

      function announce(team, name, text) {
        const feed = element('feed');
        feedSlot = (feedSlot + 1) % FEED_SLOTS;
        feed.querySelector(`[data-slot="${feedSlot}"]`)?.remove();
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.dataset.slot = String(feedSlot);
        chip.style.bottom = `${14 + feedSlot * FEED_STEP}px`;
        chip.style.left = `${20 + Math.random() * 260}px`;
        chip.innerHTML = `<i style="background:${team ? team.jersey : '#C8FF2E'}"></i>${escapeText(name)} <em>${escapeText(text)}</em>`;
        chip.addEventListener('animationend', () => chip.remove());
        feed.append(chip);
      }

      function join(id, name, team) {
        const now = Date.now();
        const existing = state.members[id];
        if (existing?.team === team.key) {
          pulse(team.key, 0.3);
          return;
        }
        if (existing && now - existing.at < SWITCH_COOLDOWN) return;
        const moved = Boolean(existing);
        if (moved) unseatFan(sectionOf[existing.team], id);
        state.members[id] = { team: team.key, at: now };
        seatFan(sectionOf[team.key], id);
        pulse(team.key, 0.35);
        refresh();
        announce(team, shownName(name), fill(moved ? texts.moved : texts.joined, { team: team.name }));
      }

      function speak(id, name, text) {
        if (!BUBBLES) return;
        const member = state.members[id];
        const team = member ? TEAMS.find((candidate) => candidate.key === member.team) : null;
        const message = cleanMessage(text);
        const now = Date.now();
        if (!team || !message || now - (spoke.get(id) ?? 0) < BUBBLE_COOLDOWN) return;
        spoke.set(id, now);
        const layer = element('bubbles');
        while (layer.children.length >= BUBBLE_LIMIT) {
          const oldest = bubbles.shift();
          oldest?.wrap.remove();
          if (!oldest) layer.firstElementChild.remove();
        }
        const wrap = document.createElement('div');
        wrap.className = 'bubble-wrap';
        wrap.style.setProperty('--tone', team.chip.bg);
        wrap.style.setProperty('--fore', team.chip.fg);
        wrap.innerHTML = `<div class="pop"><div class="who">${escapeText(shownName(name))}</div><div class="bubble">${escapeText(message)}</div></div>`;
        layer.append(wrap);
        const section = sectionOf[team.key];
        const slot = section.byId.get(id);
        if (slot !== undefined) section.hopStart[slot] = performance.now();
        const entry = { wrap, section, slot, until: performance.now() + BUBBLE_LIFETIME };
        bubbles.push(entry);
        wrap.addEventListener(
          'animationend',
          () => {
            wrap.remove();
            const index = bubbles.indexOf(entry);
            if (index >= 0) bubbles.splice(index, 1);
          },
          { once: true },
        );
        placeBubble(entry);
      }

      function placeBubble(entry) {
        const { wrap, section, slot } = entry;
        const place = slot === undefined ? { x: 0, y: 3, z: 0 } : slotPosition(slot);
        const spot = toScreen(section, { x: place.x, y: place.y + (slot === undefined ? 0 : 3.2), z: place.z });
        const half = wrap.offsetWidth / 2;
        wrap.style.left = `${Math.min(Math.max(spot.x, half + EDGE), WIDTH - half - EDGE)}px`;
        wrap.style.top = `${spot.y - 10}px`;
      }

      function findAnswer(text) {
        const padded = ` ${plain(text)} `;
        for (const [key, name] of Object.entries(question.answers)) {
          if (padded.includes(` ${key} `)) return name;
        }
        return null;
      }

      function answer(id, name, text) {
        if (answered.has(id)) return;
        const player = findAnswer(text);
        if (!player) return;
        const member = state.members[id];
        const team = member ? TEAMS.find((candidate) => candidate.key === member.team) : null;
        answered.set(id, { name: shownName(name), team, player });
        if (team) {
          state.correct[team.key] += 1;
          state.points[team.key] += ANSWER_POINTS;
          pulse(team.key, 0.6);
          refresh();
        }
        drawCard();
      }

      function onChat({ id, name, text }) {
        if (!id) return;
        const team = teamOf(text);
        if (team) join(id, name, team);
        else if (phase === 'ask') answer(id, name, text);
        speak(id, name, text);
      }

      function onLike({ id }) {
        const member = state.members[id];
        if (member) pulse(member.team, 0.12);
      }

      function giftTeam({ gift, giftId }) {
        const label = plain(gift ?? '');
        return (
          TEAMS.find((team) => {
            const entry = giftConfig[team.key] ?? {};
            return (entry.names ?? []).some((candidate) => plain(candidate) === label) || (entry.ids ?? []).map(String).includes(String(giftId));
          }) ?? null
        );
      }

      function onGift(event) {
        const team = giftTeam(event);
        if (!team) {
          announce(null, shownName(event.name), texts.giftThanks);
          return;
        }
        const points = Math.max(1, Math.round(event.diamonds || 1));
        state.points[team.key] += points;
        refresh();
        announce(team, shownName(event.name), fill(texts.gift, { team: team.name, points: number(points) }));
        pulse(team.key, 1);
        const section = sectionOf[team.key];
        const now = performance.now();
        for (let slot = 0; slot < CAPACITY; slot += 1) section.hopStart[slot] = now + Math.random() * 250;
        const spot = toScreen(section, { x: 0, y: TOP * 0.4, z: 0 });
        const burst = document.createElement('div');
        burst.className = 'burst';
        burst.style.left = `${spot.x}px`;
        burst.style.top = `${spot.y}px`;
        burst.innerHTML = Array.from({ length: Math.min(BURST_LIMIT, 20 + Math.round(Math.sqrt(points) * 3)) }, () => {
          const color = team.scarves[Math.random() < 0.5 ? 0 : 1];
          return `<i style="left:${Math.round(Math.random() * 120 - 60)}px;top:${Math.round(Math.random() * 60)}px;background:${color};--dx:${Math.round(Math.random() * 200 - 100)}px;--dy:${Math.round(-180 - Math.random() * 240)}px;--turn:${Math.round(Math.random() * 720)}deg"></i>`;
        }).join('');
        element('stage').append(burst);
        setTimeout(() => burst.remove(), 1800);
      }

      function handle(event) {
        if (event.kind === 'chat') onChat(event);
        else if (event.kind === 'like') onLike(event);
        else if (event.kind === 'gift') onGift(event);
      }

      function pickQuestion() {
        if (unused.length === 0) unused = bank.map((_, index) => index).sort(() => Math.random() - 0.5);
        return bank[unused.pop()];
      }

      const seconds = (until) => Math.max(0, Math.ceil((until - Date.now()) / 1000));

      function drawCard() {
        const card = element('card');
        card.classList.toggle('live', phase === 'ask');
        if (phase === 'wait') {
          const left = seconds(phaseEnds);
          card.innerHTML = `<div class="label">${escapeText(texts.next)}</div><div class="display wait">${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}</div>`;
          return;
        }
        const criteria = `<div class="display criteria"><b>${escapeText(question.club)}</b><i>×</i><b>${escapeText(question.country)}</b></div>`;
        if (phase === 'ask') {
          const list = [...answered.values()]
            .slice(-LISTED_ANSWERS)
            .map((entry) => `<span>✓ ${escapeText(entry.name)}${entry.team ? ` · ${entry.team.short}` : ''}</span>`)
            .join('');
          card.innerHTML = `<div class="label">${escapeText(texts.questionLabel)}</div><div class="display timer">${seconds(phaseEnds)}</div>${criteria}<div class="rule">${escapeText(texts.question)}</div><div class="list">${list}</div>`;
          return;
        }
        const reveal = question.reveal.map((name) => `<span>${escapeText(name)}</span>`).join('');
        const nobody = answered.size === 0 ? `<div class="rule">${escapeText(texts.nobody)}</div>` : '';
        card.innerHTML = `<div class="label">${escapeText(texts.reveal)}</div>${criteria}${nobody}<div class="list">${reveal}</div>`;
      }

      function tick() {
        const now = Date.now();
        if (now >= phaseEnds) {
          if (phase === 'wait') {
            question = pickQuestion();
            answered = new Map();
            phase = 'ask';
            phaseEnds = now + ANSWER_TIME;
          } else if (phase === 'ask') {
            phase = 'reveal';
            phaseEnds = now + REVEAL_TIME;
          } else {
            phase = 'wait';
            phaseEnds = now + Math.max(10000, QUESTION_EVERY - ANSWER_TIME - REVEAL_TIME);
          }
        }
        drawCard();
      }

      function listen() {
        const socket = new WebSocket(`ws://${location.host}/events`);
        socket.addEventListener('message', (message) => {
          try {
            handle(JSON.parse(message.data));
          } catch {}
        });
        socket.addEventListener('close', () => setTimeout(listen, 2000));
      }

      function demo() {
        const first = ['ahmet', 'mehmet', 'ayse', 'can', 'elif', 'emre', 'zeynep', 'burak', 'deniz', 'mert', 'selin', 'kerem', 'ece', 'baris'];
        const variants = { gs: ['GS', 'cimbom', 'Galatasaray 🦁'], fb: ['FB', 'fener', 'Fenerbahçe 💛💙'], bjk: ['BJK', 'kartal', 'Beşiktaş'], ts: ['TS', 'trabzon', 'Trabzonspor 61'], amed: ['amed', 'Amedspor'] };
        const weights = ['gs', 'gs', 'gs', 'fb', 'fb', 'fb', 'bjk', 'bjk', 'ts', 'ts', 'amed'];
        const lines = ['bu akşam bizim', 'şampiyon bizim 🏆', 'selam 👋', 'hadi be', 'kim kazanır?', 'çok iyi', 'bilemedim ya', 'amk', 'www.site.com'];
        const people = Array.from({ length: 400 }, (_, index) => ({ id: `demo${index}`, name: `${first[index % first.length]}${10 + (index % 89)}` }));
        const pick = (list) => list[Math.floor(Math.random() * list.length)];
        setInterval(() => {
          const person = pick(people);
          const roll = Math.random();
          if (roll < 0.45) handle({ kind: 'chat', ...person, text: pick(variants[pick(weights)]) });
          else if (roll < 0.65) handle({ kind: 'chat', ...person, text: pick(lines) });
          else if (roll < 0.85 && phase === 'ask') {
            const names = Object.values(question.answers);
            handle({ kind: 'chat', ...person, text: Math.random() < 0.7 ? pick(names) : 'messi' });
          } else if (roll < 0.95) handle({ kind: 'like', ...person, count: 5 });
          else {
            const team = pick(TEAMS);
            handle({ kind: 'gift', ...person, gift: giftConfig[team.key].names[0], giftId: '', count: 1, diamonds: pick([1, 1, 5, 10, 30, 99, 450]) });
          }
        }, 280);
      }

      function fitStage() {
        const stage = element('stage');
        stage.style.transformOrigin = '0 0';
        stage.style.transform = `scale(${Math.min(innerWidth / WIDTH, innerHeight / HEIGHT)})`;
      }
      addEventListener('resize', fitStage);
      fitStage();

      buildTags();
      const recent = Object.entries(state.members).sort((first, second) => first[1].at - second[1].at);
      for (const team of TEAMS) {
        for (const [id] of recent.filter(([, member]) => member.team === team.key).slice(-CAPACITY)) seatFan(sectionOf[team.key], id);
      }
      refresh();
      tick();
      setInterval(tick, 250);
      setInterval(saveState, 3000);
      if (DEMO) demo();
      else listen();
      setupSound();

      renderer.setAnimationLoop((time) => {
        const seconds = time / 1000;
        camera.position.set(CAMERA.x + Math.sin(seconds * 0.13) * SWAY, CAMERA.y + Math.sin(seconds * 0.09) * 0.4, CAMERA.z);
        camera.lookAt(TARGET.x, TARGET.y, TARGET.z);
        camera.updateMatrixWorld();
        for (const section of sections) animateFans(section, seconds, performance.now());
        renderer.render(scene, camera);
        placeTags();
        for (const entry of bubbles) placeBubble(entry);
      });
    </script>
  </body>
</html>
